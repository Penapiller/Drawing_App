<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Purrasites Drawing App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <div class="tool-group" id="toolButtons">
      <button type="button" class="tool-btn active" data-tool="brush">Brush</button>
      <button type="button" class="tool-btn" data-tool="eraser">Eraser</button>
      <button type="button" class="tool-btn" data-tool="fill">Fill</button>
    </div>

    <label class="tool-field">
      Color
      <input type="color" id="colorPicker" value="#ff8fc2">
    </label>
    <label class="tool-field">
      Brush size
      <input type="range" id="brushSize" min="2" max="60" value="18">
    </label>

    <div class="tool-group">
      <button id="undoBtn" type="button" title="Undo">Undo</button>
      <button id="redoBtn" type="button" title="Redo">Redo</button>
    </div>
    <button id="clearBtn" type="button">Clear painting</button>
  </div>

  <div id="canvasStack">
    <canvas id="paintCanvas"></canvas>
    <canvas id="linesCanvas"></canvas>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
