<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Purrasites Drawing App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="toolbar">
    <label class="tool-field">
      Color
      <input type="color" id="colorPicker" value="#ff8fc2">
    </label>
    <label class="tool-field">
      Brush size
      <input type="range" id="brushSize" min="2" max="60" value="18">
    </label>
    <button id="clearBtn" type="button">Clear painting</button>
  </div>

  <div id="canvasStack">
    <canvas id="paintCanvas"></canvas>
    <canvas id="linesCanvas"></canvas>
  </div>
</div>

<script src="js/app.js"></script>
</body>
</html>
