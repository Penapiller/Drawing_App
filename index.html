<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Purrasites Drawing App</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="leftToolbar" class="panel">
    <div class="tool-group vertical" id="toolButtons">
      <button type="button" class="tool-btn active" data-tool="brush">Brush</button>
      <button type="button" class="tool-btn" data-tool="eraser">Eraser</button>
      <button type="button" class="tool-btn" data-tool="fill">Fill</button>
    </div>

    <label class="tool-field block">
      Color
      <input type="color" id="colorPicker" value="#ff8fc2">
    </label>
    <label class="tool-field block">
      Brush size
      <input type="range" id="brushSize" min="2" max="60" value="18">
    </label>

    <div class="tool-group vertical">
      <button id="undoBtn" type="button" title="Undo">Undo</button>
      <button id="redoBtn" type="button" title="Redo">Redo</button>
    </div>
    <button id="clearBtn" type="button">Clear layer</button>
  </aside>

  <div id="canvasArea">
    <div id="canvasStack">
      <canvas id="paintCanvas"></canvas>
      <canvas id="linesCanvas"></canvas>
      <div id="brushCursor"></div>
    </div>
  </div>

  <aside id="rightPanel">
    <section class="panel" id="toolSettingsPanel">
      <h3>Brush Settings</h3>
      <label class="tool-field block">
        Opacity
        <input type="range" id="toolOpacity" min="1" max="100" value="100">
      </label>
      <label class="tool-field block">
        Stabilization
        <input type="range" id="toolStabilization" min="0" max="90" value="30">
      </label>
      <label class="tool-field block">
        Blend mode
        <select id="toolBlendMode">
          <option value="source-over">Normal</option>
          <option value="multiply">Multiply</option>
          <option value="screen">Screen</option>
          <option value="overlay">Overlay</option>
        </select>
      </label>
    </section>

    <section class="panel" id="layersPanel">
      <div class="panel-header">
        <h3>Layers</h3>
        <button id="addLayerBtn" type="button" title="Add layer">+ New</button>
      </div>
      <ul id="layerList"></ul>
    </section>
  </aside>
</div>

<script src="js/app.js"></script>
</body>
</html>
